name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android (Gradle)
        run: |
          set -e
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon --stacktrace
          else gradle assembleDebug --no-daemon --stacktrace; fi
      - name: Rilis APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find . -type f -name '*.apk' -not -path '*/node_modules/*' | grep -E 'outputs/apk|flutter-apk' | head -1)"
          if [ -z "$APK" ]; then echo "APK tidak ditemukan"; exit 1; fi
          cp "$APK" app.apk
          gh release create "apk-${{ github.run_number }}" app.apk --title "APK build ${{ github.run_number }}" --notes "Dibuat otomatis dari GitHub Actions" --target "${{ github.sha }}"
